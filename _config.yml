title: Agenda culturel Tunis
description: Concerts, cinéma, théâtre, expos… tous les événements culturels de Tunis au même endroit.
lang: fr
timezone: Africa/Tunis

# Indispensable : publier aussi les événements datés dans le futur.
future: true

# Chemin du site sur GitHub Pages : https://benjello.github.io/agenda-culturel-tunis/
# Mettre baseurl: "" le jour où on passe sur un nom de domaine à soi.
baseurl: "/agenda-culturel-tunis"
url: "https://benjello.github.io"
depot: "https://github.com/benjello/agenda-culturel-tunis"
# Adresse e-mail pour proposer un événement ou signaler une erreur sans compte GitHub (vide : pas de bouton e-mail)
contact_email: ""
# Formulaire sans compte GitHub (worker/README.md) : adresse du relais Cloudflare et clé publique Turnstile.
# Vides : le formulaire garde seulement l'envoi par GitHub ou par e-mail.
proposition_api: ""
turnstile_cle: ""

# Événements terminés gardés N jours : page Archives (et, si « purger_manuels » est vrai, suppression des
# événements saisis à la main). Lu par Jekyll (site.conservation_jours) et par scrapers/commun.py : reglage().
conservation_jours: 30
# Supprimer aussi les événements saisis à la main (_events/manuel, _events/propositions) une fois passé ce délai ?
# Désactivé en attendant la décision de Mahdi (#136).
purger_manuels: false

# Plan du site (sitemap.xml) généré par GitHub Pages
plugins:
  - jekyll-sitemap

collections:
  events:
    output: true
    permalink: /evenements/:path/
  # Fiches écrites par scrapers/pages.py après chaque passage des scrapers
  lieux:
    output: true
    permalink: /lieux/:name/
  collectifs:
    output: true
    permalink: /collectifs/:name/
  artistes:
    output: true
    permalink: /artistes/:name/

defaults:
  - scope:
      path: ""
      type: events
    values:
      layout: event
  - scope: { path: "", type: lieux }
    values: { layout: lieu }
  - scope: { path: "", type: collectifs }
    values: { layout: collectif }
  - scope: { path: "", type: artistes }
    values: { layout: artiste }

exclude:
  - README.md
  - BACKLOG.md
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _events/auto/README.md
  - scrapers
  - tests
  - requirements.txt
  - debug
