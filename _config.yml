title: Agenda culturel Tunis
description: Concerts, cinéma, théâtre, expos… tous les événements culturels de Tunis au même endroit.
lang: fr
timezone: Africa/Tunis

# Indispensable : publier aussi les événements datés dans le futur.
future: true

# Chemin du site sur GitHub Pages : https://benjello.github.io/agenda-culturel-tunis/
# Mettre baseurl: "" le jour où on passe sur un nom de domaine à soi.
baseurl: "/agenda-culturel-tunis"
url: "https://benjello.github.io"

collections:
  events:
    output: true
    permalink: /evenements/:path/
  # Fiches écrites par scrapers/pages.py après chaque passage des scrapers
  lieux:
    output: true
    permalink: /lieux/:name/
  collectifs:
    output: true
    permalink: /collectifs/:name/
  artistes:
    output: true
    permalink: /artistes/:name/

defaults:
  - scope:
      path: ""
      type: events
    values:
      layout: event
  - scope: { path: "", type: lieux }
    values: { layout: lieu }
  - scope: { path: "", type: collectifs }
    values: { layout: collectif }
  - scope: { path: "", type: artistes }
    values: { layout: artiste }

exclude:
  - README.md
  - BACKLOG.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _events/auto/README.md
  - scrapers
  - tests
  - requirements.txt
  - debug
