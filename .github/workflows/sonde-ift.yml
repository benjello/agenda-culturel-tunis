name: Sonde IFT (temporaire)
on:
  push:
    branches: [claude/project-thread-ole3m3]
    paths: [".github/sonde/**", ".github/workflows/sonde-ift.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt && sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: python -m .github.sonde.ift || PYTHONPATH=. python .github/sonde/ift.py
