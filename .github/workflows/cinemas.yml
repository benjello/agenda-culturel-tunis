name: Programmes des cinémas

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 6h, heure de Tunis
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les films à l'affiche
        run: python3 scripts/cinemas.py
      - name: Enregistrer s'il y a du nouveau
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add _data/cinema.json
          git diff --cached --quiet && echo "Rien de nouveau." && exit 0
          git commit -m "Cinémas : mise à jour des films à l'affiche"
          git push
