name: Tickets

# Hygiène des tickets. À chaque fusion sur main (push) : fermer les issues résolues par une PR
# fusionnée (« Closes #N »). Chaque mois : avertir les issues inactives depuis 60 jours, puis les
# fermer 14 jours plus tard. Sur chaque PR : signaler l'absence de « Closes #N ».

on:
  schedule:
    - cron: "0 6 1 * *"   # le 1er de chaque mois, vers 7h heure de Tunis
  push:
    branches: [main]      # à chaque fusion : ferme les issues résolues par la PR fusionnée
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      appliquer:
        description: "Appliquer le balayage (sinon, seulement le rapport)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  balayage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Balayer les issues inactives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENEMENT: ${{ github.event_name }}
          APPLIQUER: ${{ inputs.appliquer }}
        run: |
          ARGS=""
          if [ "$EVENEMENT" != "workflow_dispatch" ] || [ "$APPLIQUER" = "true" ]; then
            ARGS="--appliquer"
          fi
          python3 -m scrapers.tickets balayage $ARGS

  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier que la PR cite l'issue qu'elle ferme
        run: python3 -m scrapers.tickets pr
