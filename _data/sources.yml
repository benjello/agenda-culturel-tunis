# Registre des sources de l'agenda.
#
# Une source = un endroit fiable où un lieu, une billetterie ou un festival
# annonce sa programmation. Les scrapers relisent chaque source active chaque jour.
#
# Champs :
#   id         identifiant court, unique (lettres, chiffres, tirets)
#   nom        nom affiché sur le site
#   url        page où la programmation est publiée
#   type       lieu | billetterie | cinema | agenda
#   scraper    nom du scraper qui sait lire cette source (dossier scrapers/sources/)
#   categorie  catégorie par défaut des événements (voir _data/categories.yml)
#   actif      false : source repérée mais pas encore branchée (ou en pause)
#   options    réglages propres au scraper (facultatif)
#   tous_les_jours  relire la source seulement tous les N jours (facultatif)
#   note       remarque libre (facultatif)

- id: pathe-tunis-city
  nom: Pathé Tunis City
  url: https://www.pathe.tn/fr/cinemas/cinema-pathe-tunis-city
  type: cinema
