# Registre des sources de l'agenda.
#
# Une source = un endroit fiable où un lieu, une billetterie ou un festival
# annonce sa programmation. Les scrapers relisent chaque source active chaque jour.
#
# Champs :
#   id         identifiant court, unique (lettres, chiffres, tirets)
#   nom        nom affiché sur le site
#   url        page où la programmation est publiée
#   type       lieu | billetterie | cinema | agenda
#   scraper    nom du scraper qui sait lire cette source (dossier scrapers/sources/)
#   categorie  catégorie par défaut des événements (voir _data/categories.yml)
#   actif      false : source repérée mais pas encore branchée (ou en pause)
#   options    réglages propres au scraper (facultatif)
#   note       remarque libre (facultatif)

- id: pathe-tunis-city
  nom: Pathé Tunis City
  url: https://www.pathe.tn/fr/cinemas/cinema-pathe-tunis-city
  type: cinema
  scraper: pathe
  categorie: cinema
  actif: true
  options:
    cinema: cinema-pathe-tunis-city

- id: pathe-azur-city
  nom: Pathé Azur City
  url: https://www.pathe.tn/fr/cinemas/cinema-pathe-azur-city
  type: cinema
  scraper: pathe
  categorie: cinema
  actif: true
  options:
    cinema: cinema-pathe-azur-city

- id: teskerti
  nom: Teskerti
  url: https://teskerti.tn/
  type: billetterie
  scraper: teskerti
  categorie: autre
  actif: true
  note: Couvre aussi Le Rio, le 4ème Art et le Théâtre municipal, qui n'ont pas de site.

- id: el-teatro
  nom: El Teatro
  url: https://billetterie.elteatrotunis.com/fr/programmes
  type: lieu
  scraper: billetterie_sktech
  categorie: theatre
  actif: true
  options:
    lieu: El Teatro

- id: opera-tunis
  nom: Théâtre de l'Opéra de Tunis
  url: https://www.tunisianopera.tn/fr/programmes
  type: lieu
  scraper: billetterie_sktech
  categorie: musique
  actif: true
  options:
    lieu: Théâtre de l'Opéra de Tunis, Cité de la Culture

- id: goethe-tunis
  nom: Goethe-Institut Tunis
  url: https://www.goethe.de/ins/tn/fr/rss/ver.rss
  type: lieu
  scraper: rss
  categorie: conference
  actif: true
  options:
    lieu: Goethe-Institut Tunis
    nettoyer_titre: '\d{2}\.\d{2}\.\d{4},\s*'
  note: Flux RSS officiel des manifestations. Certaines ont lieu chez des partenaires.

- id: institut-francais
  nom: Institut français de Tunisie
  url: https://www.institutfrancais-tunisie.com/list-agenda
  type: lieu
  scraper: liste_fiches
  categorie: autre
  actif: true
  options:
    motif: details-agenda
    lieu: Institut français de Tunis
  note: La liste est peut-être chargée en JavaScript ; à vérifier au premier passage.

# ---------------------------------------------------------------------------
# Sources repérées mais pas encore branchées (actif: false). La page Sources les
# affiche « à étudier ». Toute aide pour trouver une adresse fiable est bienvenue.
# ---------------------------------------------------------------------------

